b><\/div>\n\n<div class=\"card\">\n<h2>Today’s details<\/h2>\n<div class=\"grid\">\n<div class=\"full\"><label>School name<\/label><input id=\"school\" placeholder=\"e.g. Govt. Upper Primary School, ...\"><\/div>\n<div class=\"full\"><label>Date (a saved day loads automatically)<\/label><input id=\"date\" type=\"date\"><\/div>\n<div class=\"full\"><label>Vegetable &amp; fruit rate today (₹ per kg) – enter every day<\/label><input id=\"vegrate\" class=\"big\" type=\"number\" step=\"0.5\" min=\"0\" inputmode=\"decimal\" placeholder=\"Enter today’s rate\"><\/div>\n<\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>Students present / meal taken<\/h2>\n<div class=\"sub\" style=\"margin:-6px 0 8px\">Primary = Class 1–5 (incl. Bal Vatika) · Upper Primary = Class 6–8<\/div>\n<div class=\"grid\">\n<div><label>Primary – Boys<\/label><input class=\"big\" id=\"pb\" type=\"number\" min=\"0\" inputmode=\"numeric\" placeholder=\"0\"><\/div>\n<div><label>Primary – Girls<\/label><input class=\"big\" id=\"pg\" type=\"number\" min=\"0\" inputmode=\"numeric\" placeholder=\"0\"><\/div>\n<div><label>Upper Primary – Boys<\/label><input class=\"big\" id=\"ub\" type=\"number\" min=\"0\" inputmode=\"numeric\" placeholder=\"0\"><\/div>\n<div><label>Upper Primary – Girls<\/label><input class=\"big\" id=\"ug\" type=\"number\" min=\"0\" inputmode=\"numeric\" placeholder=\"0\"><\/div>\n<\/div>\n<\/div>\n\n<div class=\"stats\">\n<div class=\"stat\"><b id=\"sBoys\">0<\/b><span>Boys<\/span><\/div>\n<div class=\"stat\"><b id=\"sGirls\">0<\/b><span>Girls<\/span><\/div>\n<div class=\"stat\"><b id=\"sTotal\">0<\/b><span>Total<\/span><\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>Ingredients needed<\/h2>\n<div class=\"wrap\"><table class=\"tbl\" id=\"ingr\"><\/table><\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>Today’s cost summary<\/h2>\n<div class=\"wrap\"><table class=\"tbl\" id=\"cost\"><\/table><\/div>\n<\/div>\n\n<details class=\"card\" open>\n<summary>Choose your rates &amp; norms<\/summary>\n<div class=\"note\" style=\"margin:6px 0 10px\">Defaults: PM POSHAN norms and the cooking cost in force from 1 May 2025 (₹6.78 primary, ₹10.17 upper primary). Please confirm against your latest Rajasthan MDM order and change if needed. Wheat/rice is Government stock, so no rate is needed. Dal, oil and spice rates are examples—enter your actual purchase rates.<\/div>\n<div class=\"wrap\"><table class=\"tbl\" id=\"set\"><\/table><\/div>\n<div class=\"grid\" style=\"margin-top:10px\">\n<div><label>Cooking cost – Primary (₹/child)<\/label><input id=\"cookP\" type=\"number\" step=\"0.01\" value=\"6.78\"><\/div>\n<div><label>Cooking cost – Upper (₹/child)<\/label><input id=\"cookU\" type=\"number\" step=\"0.01\" value=\"10.17\"><\/div>\n<div><label>Fuel / gas (₹ per child)<\/label><input id=\"fuelR\" type=\"number\" step=\"0.05\" value=\"0.60\"><\/div>\n<div><label>Aata pisai (₹ per kg wheat)<\/label><input id=\"pisR\" type=\"number\" step=\"0.1\" value=\"2\"><\/div>\n<div><label>Share of grain that is wheat (%)<\/label><input id=\"whtP\" type=\"number\" step=\"1\" min=\"0\" max=\"100\" value=\"100\"><\/div>\n<div><label>Cook honorarium (₹ per cook / month)<\/label><input id=\"hon\" type=\"number\" step=\"1\" value=\"2000\"><\/div>\n<div class=\"full\"><label>Cook-cum-helper names (one per line, for vouchers)<\/label><textarea id=\"cooks\" rows=\"3\" style=\"width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px\"><\/textarea><\/div>\n<\/div>\n<\/details>\n\n<div class=\"row\" style=\"margin-bottom:12px\">\n<button id=\"save\">Save this day to register<\/button>\n<\/div>\n\n<div class=\"card\">\n<h2>Monthly register &amp; bill<\/h2>\n<div class=\"grid\" style=\"margin-bottom:8px\"><div><label>Month<\/label><input id=\"month\" type=\"month\"><\/div><div><label>Bill no. (this month)<\/label><input id=\"billno\" placeholder=\"1\"><\/div><\/div>\n<div class=\"wrap\"><table class=\"tbl\" id=\"reg\"><\/table><\/div>\n<div class=\"row\" style=\"margin-top:10px\"><button id=\"print\">Print monthly bill<\/button><button class=\"alt\" id=\"dl\">Download Word bill<\/button><\/div>\n<button class=\"alt\" id=\"csv\" style=\"margin-top:8px;width:100%\">Download month (CSV)<\/button>\n<\/div>\n\n<div class=\"card\">\n<h2>Stock register (kg)<\/h2>\n<div class=\"note\" style=\"margin:-4px 0 8px\">Shows the month selected above. Opening stock carries forward automatically from last month’s closing. To correct it, type a number in the Opening box (orange border = typed by you); clear the box to go back to automatic.<\/div>\n<div class=\"wrap\"><table class=\"tbl\" id=\"stk\"><\/table><\/div>\n<h2 style=\"margin-top:14px\">Add stock received<\/h2>\n<div class=\"grid\">\n<div><label>Date received<\/label><input id=\"sdate\" type=\"date\"><\/div>\n<div><label>Item<\/label><select id=\"sitem\"><\/select><\/div>\n<div><label>Quantity (kg)<\/label><input id=\"sqty\" type=\"number\" step=\"0.001\" min=\"0\" inputmode=\"decimal\" placeholder=\"0\"><\/div>\n<div style=\"align-self:end\"><button id=\"sadd\" style=\"width:100%\">Add stock<\/button><\/div>\n<\/div>\n<div class=\"wrap\" style=\"margin-top:10px\"><table class=\"tbl\" id=\"rec\"><\/table><\/div>\n<\/div>\n\n<div id=\"toast\" style=\"display:none;position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:99;background:#222;color:#fff;padding:12px;border-radius:10px;font-size:14px\"><\/div>\n<div class=\"card\" id=\"bill\"><\/div>\n<\/main>\n\n<script>\nconst $=id=>document.getElementById(id);\nconst items=[\n {k:'grain',n:'Grain (अनाज)',p:100,u:150,r:0,free:true},\n {k:'dal',n:'Dal (दाल)',p:20,u:30,r:120},\n {k:'veg',n:'Vegetables & fruits (सब्जी-फल)',p:50,u:75,r:0},\n {k:'oil',n:'Oil (तेल)',p:5,u:7.5,r:160},\n {k:'salt',n:'Salt & spices (नमक-मसाले)',p:5,u:7.5,r:60},\n {k:'sugar',n:'Sugar (चीनी)',p:5,u:5,r:45}\n];\nconst num=id=>Math.max(0,parseFloat($(id).value)||0);\nconst f2=x=>x.toFixed(2),f3=x=>x.toFixed(3);\nconst inr=x=>'₹'+x.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});\n\nfunction buildSettings(){\n let h='<tr><th>Item<\/th><th>Primary g<\/th><th>Upper g<\/th><th>₹/kg<\/th><\/tr>';\n items.forEach((it,i)=>{h+=`<tr><td>${it.n}<\/td><td><input data-i=\"${i}\" data-f=\"p\" type=\"number\" step=\"0.5\" value=\"${it.p}\"><\/td><td><input data-i=\"${i}\" data-f=\"u\" type=\"number\" step=\"0.5\" value=\"${it.u}\"><\/td><td>${it.k==='veg'?'<small>daily<\/small>':it.free?'<small>Govt. stock<\/small>':`<input data-i=\"${i}\" data-f=\"r\" type=\"number\" step=\"0.5\" value=\"${it.r}\">`}<\/td><\/tr>`});\n $('set').innerHTML=h;\n $('set').querySelectorAll('input').forEach(e=>e.addEventListener('input',()=>{\n  items[e.dataset.i][e.dataset.f]=parseFloat(e.value)||0;\n  calc();\n }));\n}\n\nlet R={};\nfunction calc(){\n items.find(i=>i.k==='veg').r=num('vegrate');\n const pb=num('pb'),pg=num('pg'),ub=num('ub'),ug=num('ug');\n const P=pb+pg,U=ub+ug,boys=pb+ub,girls=pg+ug,total=P+U;\n $('sBoys').textContent=boys;$('sGirls').textContent=girls;$('sTotal').textContent=total;\n let h='<tr><th>Item<\/th><th>Primary<\/th><th>Upper<\/th><th>Total kg<\/th><\/tr>';\n let lines=[],bill=0;\n items.forEach(it=>{\n  const qp=P*it.p/1000,qu=U*it.u/1000,q=qp+qu,amt=it.free?0:q*it.r;\n  bill+=amt;lines.push({k:it.k,n:it.n,q,r:it.r,amt,free:it.free});\n  h+=`<tr><td>${it.n}<\/td><td>${f3(qp)}<\/td><td>${f3(qu)}<\/td><td><b>${f3(q)}<\/b><\/td><\/tr>`;\n });\n $('ingr').innerHTML=h;\n const fuelAmt=total*num('fuelR'),gq=(lines.find(l=>l.k==='grain')||{q:0}).q*num('whtP')/100,pisaiAmt=gq*num('pisR');bill+=fuelAmt+pisaiAmt;\n const ent=P*num('cookP')+U*num('cookU');\n const bal=ent-bill;\n let c='<tr><th>Particulars<\/th><th>Qty<\/th><th>Rate<\/th><th>Amount<\/th><\/tr>';\n lines.filter(l=>!l.free).forEach(l=>{c+=`<tr><td>${l.n}<\/td><td>${f3(l.q)} kg<\/td><td>${f2(l.r)}<\/td><td>${inr(l.amt)}<\/td><\/tr>`});\n c+=`<tr><td>Fuel / gas<\/td><td>${total}<\/td><td>${f2(num('fuelR'))}<\/td><td>${inr(fuelAmt)}<\/td><\/tr><tr><td>Aata pisai<\/td><td>${f3(gq)} kg<\/td><td>${f2(num('pisR'))}<\/td><td>${inr(pisaiAmt)}<\/td><\/tr>`;\n c+=`<tfoot><tr><td colspan=\"3\">Total expense<\/td><td>${inr(bill)}<\/td><\/tr>\n <tr><td colspan=\"3\">Cooking cost allowed<br><small style=\"font-weight:400;color:var(--mu)\">${P}×${f2(num('cookP'))} + ${U}×${f2(num('cookU'))}<\/small><\/td><td>${inr(ent)}<\/td><\/tr>\n <tr><td colspan=\"3\">${bal>=0?'Balance (saving)':'Over budget'}<\/td><td class=\"${bal>=0?'ok':'bad'}\">${inr(Math.abs(bal))}<\/td><\/tr><\/tfoot>`;\n $('cost').innerHTML=c;\n R={pb,pg,ub,ug,P,U,boys,girls,total,lines,fuelAmt,pisaiAmt,bill,ent,bal};\n}\n\nconst r2=x=>Math.round(x*100)/100;\nconst CL={P:'Primary (Class 1–5)',U:'Upper Primary (Class 6–8)'};\nconst monthLabel=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})};\nfunction rateOf(r,k){const si=r.snap&&r.snap.items.find(x=>x.k===k);if(si)return si.r||0;if(k==='veg')return 0;const it=items.find(i=>i.k===k);return it?it.r:0}\nfunction splitOf(r){const s=r.snap;if(s)return {pb:s.pb,pg:s.pg,ub:s.ub,ug:s.ug};const pb=Math.min(r.boys,r.P),pg=r.P-pb;return {pb,pg,ub:Math.max(0,r.boys-pb),ug:Math.max(0,r.girls-pg)}}\nfunction dayCalc(r){\n const sn=r.snap,sp=splitOf(r);\n const fu=sn&&sn.fuel!=null?sn.fuel:num('fuelR'),pr=sn&&sn.pisai!=null?sn.pisai:num('pisR'),wh=sn&&sn.wheat!=null?sn.wheat:num('whtP');\n const vr=rateOf(r,'veg'),cls={};let t=0;\n [['P',r.P,'p',sp.pb,sp.pg],['U',r.U,'u',sp.ub,sp.ug]].forEach(([c,n,nk,b,g])=>{\n  const q={},a={};\n  items.forEach(it=>{const si=sn&&sn.items.find(x=>x.k===it.k),nm=si?si[nk]:it[nk];q[it.k]=n*nm/1000;a[it.k]=it.free?0:r2(q[it.k]*rateOf(r,it.k))});\n  const o={n,b,g,q,a,gr:r2(a.dal+a.oil+a.salt),v:a.veg,sg:a.sugar,fu:r2(n*fu),wk:q.grain*wh/100};\n  o.pi=r2(o.wk*pr);o.t=r2(o.gr+o.v+o.sg+o.fu+o.pi);t+=o.t;cls[c]=o;\n });\n return {vr,cls,t:r2(t)};\n}\nfunction monthData(m){\n const rows=load().filter(r=>r.date.startsWith(m)).sort((a,b)=>a.date<b.date?-1:1);\n const mk=()=>({n:0,b:0,g:0,q:{},a:{},gr:0,v:0,sg:0,fu:0,pi:0,wk:0,t:0,days:[]});\n const M={n:rows.length,P:mk(),U:mk(),t:0,missing:[]};\n rows.forEach(r=>{\n  const c=dayCalc(r);M.t+=c.t;if(!(c.vr>0))M.missing.push(r.date);\n  ['P','U'].forEach(k=>{const d=c.cls[k],T=M[k];\n   T.n+=d.n;T.b+=d.b;T.g+=d.g;\n   items.forEach(it=>{T.q[it.k]=(T.q[it.k]||0)+d.q[it.k];T.a[it.k]=(T.a[it.k]||0)+d.a[it.k]});\n   T.gr+=d.gr;T.v+=d.v;T.sg+=d.sg;T.fu+=d.fu;T.pi+=d.pi;T.wk+=d.wk;T.t+=d.t;\n   T.days.push({date:r.date,n:d.n,vr:c.vr,vq:d.q.veg,va:d.v});\n  });\n });\n return M;\n}\nfunction billSpecs(M){\n const nm=k=>items.find(i=>i.k===k).n,av=(a,q)=>q>0?a/q:0,S=[];\n ['P','U'].forEach(c=>{const T=M[c];S.push({title:'Groceries – '+CL[c],c,rows:['dal','oil','salt'].map(k=>[nm(k),T.q[k],av(T.a[k],T.q[k]),T.a[k]]),total:T.gr,note:'Wheat / rice is Government stock and is not billed.'})});\n ['P','U'].forEach(c=>{const T=M[c];S.push({title:'Vegetables & Fruits – '+CL[c],c,rows:[[nm('veg'),T.q.veg,av(T.v,T.q.veg),T.v]],total:T.v,note:'Rate shown is the average of the daily rates below.',days:T.days})});\n S.push({title:'Aata Pisai (Wheat Grinding)',rows:[['Primary – wheat ground',M.P.wk,av(M.P.pi,M.P.wk),M.P.pi],['Upper Primary – wheat ground',M.U.wk,av(M.U.pi,M.U.wk),M.U.pi]],total:M.P.pi+M.U.pi});\n S.push({title:'Fuel / Gas',qh:'Meals',int:1,rows:[['Primary – meals served',M.P.n,av(M.P.fu,M.P.n),M.P.fu],['Upper Primary – meals served',M.U.n,av(M.U.fu,M.U.n),M.U.fu]],total:M.P.fu+M.U.fu});\n S.push({title:'Sugar',rows:[['Primary – sugar',M.P.q.sugar,av(M.P.sg,M.P.q.sugar),M.P.sg],['Upper Primary – sugar',M.U.q.sugar,av(M.U.sg,M.U.q.sugar),M.U.sg]],total:M.P.sg+M.U.sg});\n return S;\n}\nfunction mealsLine(sp,M){if(sp.c){const T=M[sp.c];return CL[sp.c]+': boys '+T.b+', girls '+T.g+', total meals '+T.n+' in '+M.n+' working days'}return 'Primary '+M.P.n+' + Upper Primary '+M.U.n+' = '+(M.P.n+M.U.n)+' meals in '+M.n+' working days'}\nconst qf=(sp,q)=>sp.int?String(Math.round(q)):f3(q);\nfunction bn(i){const b=$('billno').value.trim();if(!b)return '____';return /^\\d+$/.test(b)?String(+b+i):b+'-'+(i+1)}\nfunction words(n){n=Math.round(n);if(!n)return 'Zero';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];\n const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:''),th=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');\n let s='';const cr=Math.floor(n/1e7),lk=Math.floor(n%1e7/1e5),k=Math.floor(n%1e5/1e3),r=n%1e3;\n if(cr)s+=th(cr)+' Crore ';if(lk)s+=two(lk)+' Lakh ';if(k)s+=two(k)+' Thousand ';if(r)s+=th(r);return s.trim()}\nconst cookList=()=>{const l=$('cooks').value.split('\\n').map(x=>x.trim()).filter(Boolean);return l.length?l:['']};\nconst sigH=(a,b,c)=>`<div style=\"display:flex;justify-content:space-between;margin-top:46px\"><span>${a}<\/span><span>${b}<\/span><span>${c}<\/span><\/div>`;\nconst headH=(t,sub,M,no)=>`<div style=\"text-align:center\"><h2 style=\"font-size:18px;margin:0\">${t}<\/h2><div><b>${sub}<\/b><\/div><div>${X($('school').value)||'School name: ____________________'}<\/div><\/div><div style=\"display:flex;justify-content:space-between;margin:8px 0\"><span>Month: ${M.label}<\/span><span>${no}<\/span><\/div>`;\nfunction billHTML(sp,i,M){\n let b=`<section class=\"pg\">`+headH('PM POSHAN (Mid Day Meal) – Bill '+(i+1)+' of 7',X(sp.title),M,'Bill no.: '+bn(i))+`<p style=\"margin:6px 0\">${mealsLine(sp,M)}<\/p>\n <table class=\"tbl\"><tr><th>Item<\/th><th>${sp.qh||'Qty (kg)'}<\/th><th>Rate (₹)<\/th><th>Amount<\/th><\/tr>`;\n sp.rows.forEach(r=>{b+=`<tr><td>${X(r[0])}<\/td><td>${qf(sp,r[1])}<\/td><td>${f2(r[2])}<\/td><td>${inr(r[3])}<\/td><\/tr>`});\n b+=`<tfoot><tr><td colspan=\"3\">Total<\/td><td it rate (Rs/kg),Total bill (Rs)\\n';\n rows.forEach(r=>{const c=dayCalc(r);s+=[r.date,r.boys,r.girls,r.P,r.U,r.boys+r.girls,c.vr.toFixed(2),c.t.toFixed(2)].join(',')+'\\n'});\n saveFile('MDM-Register-'+(m||'all')+'.csv',s);\n};\n$('bill').addEventListener('click',e=>{\n if(e.target.id==='closeBill')document.body.classList.remove('showbill');\n if(e.target.id==='doPrint')printBill();\n});\n\n['pb','pg','ub','ug','date','vegrate','cookP','cookU','fuelR','pisR','whtP'].forEach(id=>$(id).addEventListener('input',calc));\n$('school').addEventListener('input',saveMeta);$('billno').addEventListener('input',saveMeta);$('hon').addEventListener('input',saveMeta);$('cooks').addEventListener('input',saveMeta);\n$('date').addEventListener('change',()=>{if(load().some(r=>r.date===$('date').value))loadDay($('date').value);else{$('vegrate').value='';calc()}});\n$('month').addEventListener('input',drawReg);\nconst t=new Date();$('date').value=t.toISOString().slice(0,10);$('month').value=$('date').value.slice(0,7);\nfunction loadDay(date){\n const r=load().find(x=>x.date===date);if(!r)return false;\n const s=r.snap;let pb,pg,ub,ug;\n if(s){pb=s.pb;pg=s.pg;ub=s.ub;ug=s.ug}\n else{pb=Math.min(r.boys,r.P);pg=r.P-pb;ub=Math.max(0,r.boys-pb);ug=Math.max(0,r.girls-pg)}\n $('pb').value=pb;$('pg').value=pg;$('ub').value=ub;$('ug').value=ug;\n if(s){\n  s.items.forEach(si=>{const it=items.find(i=>i.k===si.k);if(it){it.p=si.p;it.u=si.u;it.r=si.r}});\n  $('cookP').value=s.cookP;$('cookU').value=s.cookU;if(s.school)$('school').value=s.school;if(s.fuel!=null)$('fuelR').value=s.fuel;if(s.pisai!=null)$('pisR').value=s.pisai;if(s.wheat!=null)$('whtP').value=s.wheat;\n }\n $('vegrate').value=s?(items.find(i=>i.k==='veg').r||''):'';\n $('date').value=date;buildSettings();calc();\n toast(s?'Loaded bill of '+new Date(date).toLocaleDateString('en-IN')+' with the rates used that day.':'Older record: Primary/Upper Primary split is estimated and current rates are used. Check before sending.');\n return true;\n}\n/* stock */\nconst SK='mdm_stock_v1';\nfunction loadS(){try{return JSON.parse(localStorage.getItem(SK))||{open:{},rec:[]}}catch(e){return window._ms||{open:{},rec:[]}}}\nfunction storeS(s){window._ms=s;try{localStorage.setItem(SK,JSON.stringify(s))}catch(e){}}\nfunction usedIn(r){if(r.q)return r.q;const q={};items.forEach(it=>q[it.k]=(r.P*it.p+r.U*it.u)/1000);return q}\nfunction nextM(m){let [y,mo]=m.split('-').map(Number);mo++;if(mo>12){mo=1;y++}return y+'-'+String(mo).padStart(2,'0')}\nfunction zero(){const z={};items.filter(it=>it.k!=='veg').forEach(it=>z[it.k]=0);return z}\nfunction stockFor(m){\n const S=loadS(),days=load();\n const ms=[m,...days.map(r=>r.date.slice(0,7)),...S.rec.map(r=>r.date.slice(0,7)),...Object.keys(S.open)].sort();\n let cur=ms[0],carry=zero();\n for(let n=0;n<240;n++){\n  const man=S.open[cur]||{},open={},recv=zero(),used=zero(),close={};\n  S.rec.filter(r=>r.date.startsWith(cur)).forEach(r=>{if(r.k in recv)recv[r.k]+=r.q});\n  days.filter(r=>r.date.startsWith(cur)).forEach(r=>{const q=usedIn(r);for(const k in used)used[k]+=q[k]||0});\n  for(const k in carry){open[k]=man[k]!=null?man[k]:carry[k];close[k]=open[k]+recv[k]-used[k]}\n  if(cur===m)return {open,recv,used,close};\n  carry=close;cur=nextM(cur);\n }\n return {open:zero(),recv:zero(),used:zero(),close:zero()};\n}\nfunction drawStock(){\n const m=$('month').value||new Date().toISOString().slice(0,7);\n const st=stockFor(m),S=loadS(),nm=n=>n.replace(/\\s*\\(.*\\)/,'');\n let h='<tr><th>Item<\/th><th>Opening<\/th><th>Added<\/th><th>Used<\/th><th>Closing<\/th><\/tr>';\n items.filter(i=>i.k!=='veg').forEach(it=>{const k=it.k,man=S.open[m]&&S.open[m][k]!=null;\n  h+=`<tr><td>${nm(it.n)}<\/td><td><input class=\"so\" data-k=\"${k}\" type=\"number\" step=\"0.001\" value=\"${Number(st.open[k].toFixed(3))}\" style=\"width:86px;padding:6px;text-align:right${man?';border-color:var(--ac)':''}\"><\/td><td>${f3(st.recv[k])}<\/td><td>${f3(st.used[k])}<\/td><td class=\"${st.close[k]<-0.0005?'bad':''}\"><b>${f3(st.close[k])}<\/b><\/td><\/tr>`});\n $('stk').innerHTML=h;\n $('stk').querySelectorAll('.so').forEach(e=>e.onchange=()=>{const S2=loadS();S2.open[m]=S2.open[m]||{};if(e.value==='')delete S2.open[m][e.dataset.k];else S2.open[m][e.dataset.k]=parseFloat(e.value)||0;storeS(S2);drawStock()});\n const rr=S.rec.filter(r=>r.date.startsWith(m)).sort((a,b)=>a.date<b.date?-1:1);\n let t='<tr><th>Date<\/th><th>Item<\/th><th>Qty (kg)<\/th><th><\/th><\/tr>';\n rr.forEach(r=>{const it=items.find(i=>i.k===r.k);t+=`<tr><td>${new Date(r.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}<\/td><td>${it?nm(it.n):r.k}<\/td><td>${f3(r.q)}<\/td><td><button class=\"x rx\" data-id=\"${r.id}\">✕<\/button><\/td><\/tr>`});\n if(!rr.length)t+='<tr><td colspan=\"4\" style=\"text-align:center;color:var(--mu)\">No stock added this month<\/td><\/tr>';\n $('rec').innerHTML=t;\n $('rec').querySelectorAll('.rx').forEach(b=>b.onclick=()=>{const S2=loadS();S2.rec=S2.rec.filter(r=>r.id!==b.dataset.id);storeS(S2);drawStock()});\n}\n$('sadd').onclick=()=>{\n const date=$('sdate').value,q=parseFloat($('sqty').value);\n if(!date||!(q>0)){alert('Enter the date and quantity');return}\n const S=loadS();S.rec.push({id:Date.now()+'-'+Math.random(),date,k:$('sitem').value,q});storeS(S);\n $('month').value=date.slice(0,7);$('sqty').value='';drawReg();\n};\n$('sitem').innerHTML=items.filter(i=>i.k!=='veg').map(i=>`<option value=\"${i.k}\">${i.n.replace(/\\s*\\(.*\\)/,'')}<\/option>`).join('');\n$('sdate').value=new Date().toISOString().slice(0,10);\nbuildSettings();calc();drawReg();\n<\/script>\n<\/body>\n<\/html>\n";</script>
